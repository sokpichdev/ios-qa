name: Build & Deploy Site

on:
  push:
    branches: [main]
    paths:
      # Rebuild whenever any Q&A content or the generator script changes
      - "**.md"
      - "scripts/generate_site.py"
      - ".github/workflows/build-site.yml"
  workflow_dispatch: # also allows manual trigger from the Actions tab

permissions:
  contents: write   # needed to commit the generated index.html back

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1 ── Checkout the full repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git blame works if needed

      # 2 ── Run the generator (pure stdlib, no pip install needed)
      - name: Generate index.html
        run: python3 scripts/generate_site.py

      # 3 ── Commit & push the freshly built index.html
      - name: Commit generated site
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          # Only commit when there's actually a diff
          git diff --cached --quiet || git commit -m "chore: regenerate site [skip ci]"
          git push
